services:

  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.12
    container_name: zigbee2mqtt
    restart: unless-stopped

    ports:
      - "8080:8080"

    volumes:
      - ${ROOT}/runtime/zigbee2mqtt:/app/data

    networks:
      - mqtt-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mqtt-net:
    external: true

      
