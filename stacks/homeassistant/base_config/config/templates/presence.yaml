- binary_sensor:

    # Turns ON when at least one PIR sensor detects motion
    - name: "PIR all"
      unique_id: pir_all
      device_class: occupancy
      state: >
        {% set pir_list = [
          'binary_sensor.pir_1_occupancy',
          'binary_sensor.pir_2_occupancy',
          'binary_sensor.pir_3_occupancy',
          'binary_sensor.pir_4_occupancy',
          'binary_sensor.pir_5_occupancy'
        ] %}
        {% set active_pirs = expand(pir_list)
          | selectattr('state', 'eq', 'on')
          | list %}
        {{ active_pirs | count >= 1 }}
        
    # Keeps motion state ON for 30 minutes after the last detection
    - name: "PIR Recent Motion"
      unique_id: pir_recent_motion
      device_class: motion
      state: >
        {{ is_state('binary_sensor.pir_all', 'on') }}
      delay_off:
        minutes: 30

    # Turns ON when no PIR has detected motion for 30 minutes
    - name: "PIR No Recent Motion"
      unique_id: pir_no_recent_motion
      state: >
        {{ is_state('binary_sensor.pir_recent_motion', 'off') }}

    # Turns ON only when at least two PIR sensors detect motion simultaneously
    # Used to confirm real movement and reduce false positives
    - name: "PIR Confirmed Motion"
      unique_id: pir_confirmed_motion
      device_class: motion
      state: >
        {% set pir_list = [
          'binary_sensor.pir_1_occupancy',
          'binary_sensor.pir_2_occupancy',
          'binary_sensor.pir_3_occupancy',
          'binary_sensor.pir_4_occupancy',
          'binary_sensor.pir_5_occupancy'
        ] %}
        {% set active_pirs = expand(pir_list)
          | selectattr('state', 'eq', 'on')
          | list %}
        {{ active_pirs | count >= 2 }}
