  - action: switch.turn_on
    metadata: {}
    target:
      entity_id:
      - switch.kitchen_lights_switches
    data: {}
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.ground_floor_lights_2
    data:
      brightness_pct: 40
      color_temp_kelvin: 2000
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
