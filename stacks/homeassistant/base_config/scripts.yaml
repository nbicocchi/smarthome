alarmo_manage_trigger:
  sequence:
  - condition: sun.is_night
    options: {}
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.state_garden_override
    data:
      option: script.garden_security
  - delay:
      hours: 0
      minutes: 5
      seconds: 0
      milliseconds: 0
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.state_garden_override
    data:
      option: none
  alias: Alarmo trigger actions
  description: ''
