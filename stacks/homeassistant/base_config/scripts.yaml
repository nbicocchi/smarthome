garden_apply:
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_select.state_garden_override'') != ''none''
          }}

          '
      sequence:
      - action: script.turn_on
        target:
          entity_id: '{{ states(''input_select.state_garden_override'') }}

            '
    default:
    - action: script.turn_on
      target:
        entity_id: '{{ states(''input_select.state_garden'') }}

          '
  alias: Garden apply
  description: ''
home_apply:
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_select.state_home_override'') != ''none''
          }}

          '
      sequence:
      - action: script.turn_on
        target:
          entity_id: '{{ states(''input_select.state_home_override'') }}

            '
    default:
    - action: script.turn_on
      target:
        entity_id: '{{ states(''input_select.state_home'') }}

          '
  alias: Home apply
  description: ''
garden_security:
  sequence:
