home_bedtime:
  sequence:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.home_state
    data:
      option: Bedtime
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.kitchen_lights_switches
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.ground_floor_lights_2
    data:
      brightness_pct: 25
      color_temp_kelvin: 2000
  - action: light.turn_on
    metadata: {}
    target:
      entity_id: light.nicola_s_desk
    data:
      brightness_pct: 10
      color_temp_kelvin: 2000
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - action: light.turn_on
    metadata: {}
    target:
      entity_id:
      - light.upper_corridor_lamp
      - light.lower_corridor_lamp
      - light.girls_lamp
    data:
      rgb_color:
      - 255
      - 0
      - 207
      brightness_pct: 100
  alias: Home bedtime
  description: ''
