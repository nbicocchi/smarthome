- id: '1784117377964'
  alias: Lights - on at sunset (home)
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id: sensor.light_sensor_illuminance
    for:
      hours: 0
      minutes: 5
      seconds: 0
    below: 900
  conditions:
  - condition: sun
    before: sunset
    after: sunset
    after_offset:
      hours: -3
      minutes: 0
      seconds: 0
  - condition: state
    entity_id: input_select.state_home
    state: script.home_off
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.state_home
    data:
      option: script.home_soft
  mode: single
- id: '1784138757054'
