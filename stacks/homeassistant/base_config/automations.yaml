- id: '1782314344551'
  alias: Lights - red at night (home)
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.pir_all
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_select.state_home
    state:
    - script.home_off
  - condition: sun.is_night
    options: {}
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.state_home_override
    data:
      option: script.home_red
  - delay:
      minutes: 10
  - action: input_select.select_option
    target:
      entity_id: input_select.state_home_override
    data:
      option: none
  mode: restart
- id: '1782396257680'
  alias: Alarmo - arm away (home looks empty)
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.nicola_bicocchi
    - person.marzia_risi
    to:
    - not_home
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - trigger: state
    entity_id:
    - binary_sensor.pir_recent_motion
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
  conditions:
  - condition: state
    entity_id: person.nicola_bicocchi
    state:
    - not_home
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - condition: state
    entity_id: person.marzia_risi
    state:
    - not_home
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - condition: state
    entity_id: binary_sensor.pir_recent_motion
    state:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 0
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state:
    - armed_home
    - disarmed
  actions:
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.alarmo
  mode: single
- id: '1782689779297'
  alias: Alarmo - arm home (someone comes back)
  description: ''
  triggers:
  - trigger: state
