- id: '1785869283532'
  alias: Lights - on at sunset (garden)
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.light_sensor_illuminance
    for:
      hours: 0
      minutes: 5
      seconds: 0
    below: 150
  conditions:
  - condition: sun
    before: sunset
    after: sunset
    after_offset:
      hours: -3
      minutes: 0
      seconds: 0
    before_offset:
      hours: 1
      minutes: 0
      seconds: 0
  - condition: state
    entity_id: input_select.state_garden
    state: script.garden_off
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.state_garden
    data:
      option: script.garden_soft
  mode: single
