  conditions:
  - condition: state
    entity_id: alarm_control_panel.alarmo
    state: armed_away
  actions:
  - action: alarm_control_panel.alarm_disarm
    metadata: {}
    target:
      entity_id: alarm_control_panel.alarmo
    data: {}
  mode: single
