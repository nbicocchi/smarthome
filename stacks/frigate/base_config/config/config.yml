mqtt:
  host: mosquitto
  topic_prefix: frigate

detectors:
  ov:
    type: openvino
    device: CPU

#model:
#  width: 300
#  height: 300
#  input_tensor: nhwc
#  input_pixel_format: bgr
#  path: /openvino-model/ssdlite_mobilenet_v2.xml
#  labelmap_path: /openvino-model/coco_91cl_bkgr.txt

model:
  model_type: yolo-generic
  width: 320 # <--- should match the imgsize set during model export
  height: 320 # <--- should match the imgsize set during model export
  input_tensor: nchw
  input_dtype: float
  path: /config/model_cache/yolov9-t-320.onnx
  labelmap_path: /labelmap/coco-80.txt

go2rtc:
  streams:
    #tapo_main: rtsp://nicola:episteme@192.168.1.158:554/stream1
    #tapo_sub: rtsp://nicola:episteme@192.168.1.158:554/stream2

    annke_main: 
      rtsp://admin:C%24utg04bkqD-L4O@192.168.1.130:554/Streaming/Channels/101
    annke_sub: 
      rtsp://admin:C%24utg04bkqD-L4O@192.168.1.130:554/Streaming/Channels/102

record:
  enabled: True
  alerts:
    retain:
      days: 7
      mode: active_objects
  detections:
    retain:
      days: 7
      mode: active_objects

snapshots:
  enabled: true
  retain:
    default: 7

objects:
  track:
    - person
    - car
    - motorcycle
    - truck

cameras:

  annke:
    ffmpeg:
      hwaccel_args: preset-vaapi
      inputs:
        - path: rtsp://127.0.0.1:8554/annke_sub
          roles:
            - detect

        - path: rtsp://127.0.0.1:8554/annke_main
          roles:
            - record

    motion:
      threshold: 25
      contour_area: 20
      improve_contrast: true
      mask: 0,0,1,0,1,0.595,0,0.622

    zones:
      garden:
        coordinates: 0,0.637,1,0.609,1,1,0,1
        loitering_time: 0
        friendly_name: Garden
        inertia: 3

    detect:
      enabled: true
      width: 1200
      height: 536
      fps: 8

version: 0.17-0
