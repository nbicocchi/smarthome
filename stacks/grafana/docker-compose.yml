services:

  grafana:
    image: grafana/grafana:13.0
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3000:3000"
    
    volumes:
      - ${ROOT}/runtime/grafana:/var/lib/grafana

    networks:
      - mqtt-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mqtt-net:
    external: true
