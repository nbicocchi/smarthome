services:
  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: unless-stopped

    ports:
      - "8086:8086"

    # Setup iniziale dalla UI:
    # Organizzazione: home
    # Bucket: homeassistant
    # Utente iniziale: admin
    # Configurare anche un token per Grafana.

    volumes:
      - ../../runtime/influxdb/data:/var/lib/influxdb2
      - ../../runtime/influxdb/config:/etc/influxdb2

    networks:
      - mqtt-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mqtt-net:
    external: true
