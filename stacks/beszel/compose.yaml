
services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped

    environment:
      APP_URL: http://192.168.1.100:8090

    ports:
      - "8090:8090"

    volumes:
      - ${ROOT}/runtime/beszel/beszel_data:/beszel_data
      - ${ROOT}/runtime/beszel/beszel_socket:/beszel_socket

    networks:
      - mqtt-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    
    volumes:
      - ${ROOT}/runtime/beszel/beszel_agent_data:/var/lib/beszel-agent
      - ${ROOT}/runtime/beszel/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExNwDDwCm0Wx5SrdWwes1bKWHwhBOVSu2Obe3PIJ66+"
      TOKEN: "3aa5-cd6efd63f2-2415-08d91d9a6"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mqtt-net:
    external: true

