services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped

    ports:
      - "9443:9443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ROOT}/runtime/portainer/data:/data

    networks:
      - mqtt-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  mqtt-net:
    external: true
